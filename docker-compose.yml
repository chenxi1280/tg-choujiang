name: tg-lottery

x-runtime: &runtime
  image: ${TG_LOTTERY_APP_IMAGE:-tg-lottery-app:latest}
  restart: unless-stopped
  env_file:
    - ${ENV_FILE:-.env.docker.example}
  environment:
    BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
    BOT_ID: ${BOT_ID:-}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
    ADMIN_IDS: ${ADMIN_IDS:-}
    OPS_ADMIN_IDS: ${OPS_ADMIN_IDS:-}
    TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
    GUIDE_CHANNEL_URL: ${GUIDE_CHANNEL_URL:-}
    NAVIGATION_CHANNEL_URL: ${NAVIGATION_CHANNEL_URL:-}
    FEATURED_CHANNEL_URL: ${FEATURED_CHANNEL_URL:-}
    PLATFORM_REQUIRED_ENABLED: ${PLATFORM_REQUIRED_ENABLED:-false}
    PLATFORM_POLICY_VERSION: ${PLATFORM_POLICY_VERSION:-official-v2}
    PLATFORM_OFFICIAL_CHANNELS: ${PLATFORM_OFFICIAL_CHANNELS:-[]}
    PLATFORM_OBSERVATION_MAX_AGE_SECONDS: ${PLATFORM_OBSERVATION_MAX_AGE_SECONDS:-300}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    POLL_TIMEOUT_SECONDS: ${POLL_TIMEOUT_SECONDS:-30}
    POLL_LEASE_SECONDS: ${POLL_LEASE_SECONDS:-60}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    QUALIFICATION_REQUESTS_PER_SECOND: ${QUALIFICATION_REQUESTS_PER_SECOND:-20}
    RELEASE_SHA: ${RELEASE_SHA:-unknown}
    RELEASE_ID: ${RELEASE_ID:-unknown}
  networks:
    - infra_default

services:
  app:
    <<: *runtime
    container_name: tg-lottery-app
    command: ["python", "-m", "tg_lottery.app"]
    healthcheck:
      test: ["CMD", "python", "-m", "tg_lottery.healthcheck", "--role", "app"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 40s

  worker:
    <<: *runtime
    container_name: tg-lottery-worker
    command: ["python", "-m", "tg_lottery.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "tg_lottery.healthcheck", "--role", "worker"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 40s

  ops-bot:
    image: ${TG_LOTTERY_APP_IMAGE:-tg-lottery-app:latest}
    profiles: ["ops"]
    restart: "no"
    environment:
      OPS_BOT_TOKEN: ${OPS_BOT_TOKEN:-}
      OPS_BOT_ID: ${OPS_BOT_ID:-}
      OPS_ADMIN_IDS: ${OPS_ADMIN_IDS:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      RELEASE_ID: ${RELEASE_ID:-unknown}
    command: ["python", "-m", "tg_lottery.ops_bot"]
    networks:
      - infra_default

  migrate:
    image: ${TG_LOTTERY_APP_IMAGE:-tg-lottery-app:latest}
    profiles: ["tools"]
    restart: "no"
    env_file:
      - ${ENV_FILE:-.env.docker.example}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["alembic", "upgrade", "head"]
    networks:
      - infra_default

networks:
  infra_default:
    name: ${INFRA_NETWORK_NAME:-infra_default}
    external: true
