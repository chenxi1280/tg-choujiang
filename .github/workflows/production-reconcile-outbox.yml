name: Production Reconcile Outbox

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or apply the exact reconciled candidate set.
        required: true
        type: choice
        options:
          - preview
          - apply
      start_at:
        description: Candidate window start in UTC (YYYY-MM-DDTHH:MM:SSZ)
        required: true
        default: '2026-08-15T13:00:00Z'
      end_at:
        description: Candidate window end in UTC (YYYY-MM-DDTHH:MM:SSZ)
        required: true
        default: '2026-08-15T16:10:00Z'
      expected_fingerprint:
        description: Required for apply; copy from preview output.
        required: false
        default: ''
      expected_count:
        description: Required candidate count for apply.
        required: true
        default: '3'
      repair_ref:
        description: Human-readable audit reference.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: tg-lottery-production-reconcile-outbox
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ vars.PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          START_AT: ${{ inputs.start_at }}
          END_AT: ${{ inputs.end_at }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: |
          set -euo pipefail
          timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          [[ "${MODE}" == "preview" || "${MODE}" == "apply" ]]
          [[ "${START_AT}" =~ ${timestamp_pattern} ]]
          [[ "${END_AT}" =~ ${timestamp_pattern} ]]
          [[ "${EXPECTED_COUNT}" =~ ^[1-9][0-9]*$ ]]
          if [[ "${MODE}" == "apply" ]]; then
            [[ "${EXPECTED_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]
          fi
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
      - name: Reconcile legacy unknown outbox rows
        env:
          MODE: ${{ inputs.mode }}
          START_AT: ${{ inputs.start_at }}
          END_AT: ${{ inputs.end_at }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          INPUT_REPAIR_REF: ${{ inputs.repair_ref }}
          PRODUCTION_BASE_DIR: ${{ vars.PRODUCTION_BASE_DIR }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tg-lottery}"
          REPAIR_REF="${INPUT_REPAIR_REF:-github:${GITHUB_RUN_ID_VALUE}:${GITHUB_SHA_VALUE}}"
          ssh production-server \
            "BASE_DIR='${BASE_DIR}' MODE='${MODE}' START_AT='${START_AT}' END_AT='${END_AT}' EXPECTED_FINGERPRINT='${EXPECTED_FINGERPRINT}' EXPECTED_COUNT='${EXPECTED_COUNT}' REPAIR_REF='${REPAIR_REF}' bash -s" \
            <<'REMOTE'
          set -euo pipefail
          source "${BASE_DIR}/current/deploy/docker-env.sh"
          resolve_docker_command
          args=(
            --mode "${MODE}"
            --start-at "${START_AT}"
            --end-at "${END_AT}"
            --expected-count "${EXPECTED_COUNT}"
            --repair-ref "${REPAIR_REF}"
          )
          if [[ "${MODE}" == "apply" ]]; then
            args+=(--expected-fingerprint "${EXPECTED_FINGERPRINT}")
          fi
          docker_cmd exec tg-lottery-worker python -m tg_lottery.ops.reconcile_legacy_outbox "${args[@]}"
          if [[ "${MODE}" == "apply" ]]; then
            bash "${BASE_DIR}/current/deploy/check-services.sh"
          fi
          REMOTE
