name: Deploy Production

'on':
  workflow_dispatch:
  push:
    branches:
      - release

concurrency:
  group: tg-lottery-deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: chenxi1280
  APP_IMAGE_NAME: tg-lottery-app

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lottery_test
          POSTGRES_PASSWORD: lottery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lottery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:lottery_test@127.0.0.1:5432/lottery_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:lottery_test@127.0.0.1:5432/lottery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate application and migrations
        run: |
          ruff format --check src tests alembic scripts
          ruff check src tests alembic scripts
          python scripts/check_code_metrics.py
          python -m compileall -q src tests alembic scripts
          alembic upgrade head
          alembic check
          pytest
        timeout-minutes: 2
      - name: Compose config
        run: docker compose --env-file .env.docker.example config >/dev/null

  build-image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: true
          tags: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ env.APP_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=tg-lottery-app
          cache-to: type=gha,mode=max,scope=tg-lottery-app

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: [checks, build-image]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${GHCR_TOKEN}"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${DEPLOY_PORT:-22}"
          cat > ~/.ssh/config <<EOF
          Host production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config
      - name: Deploy immutable release
        env:
          PRODUCTION_BASE_DIR: ${{ vars.PRODUCTION_BASE_DIR }}
          RELEASE_BRANCHES: ${{ vars.RELEASE_BRANCHES }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          TG_LOTTERY_APP_IMAGE: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ env.APP_IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tg-lottery}"
          BRANCHES="${RELEASE_BRANCHES:-release}"
          bash deploy/release.sh \
            --host production-server \
            --base-dir "${BASE_DIR}" \
            --branch-list "${BRANCHES}"
