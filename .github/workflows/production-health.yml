name: Production Health

'on':
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: tg-lottery-production-health
  cancel-in-progress: true

jobs:
  health:
    if: ${{ vars.PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
      - name: Verify runtime and unresolved facts
        env:
          PRODUCTION_BASE_DIR: ${{ vars.PRODUCTION_BASE_DIR }}
        run: |
          set -euo pipefail
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tg-lottery}"
          output_file="$(mktemp "${RUNNER_TEMP}/production-health.XXXXXX")"
          status=0
          ssh production-server \
            "BASE_DIR='${BASE_DIR}' bash '${BASE_DIR}/current/deploy/check-services.sh'" \
            >"${output_file}" 2>&1 || status=$?
          cat "${output_file}"
          {
            echo '### Production delivery health'
            echo 'Acknowledged deliveries remain unconfirmed; the identifiers below are not success receipts.'
            echo '```text'
            sed -n '/^STATUS=/p; /^CHECK_STATUS=/p; /^UNKNOWN_/p; /^app /p; /^worker /p' "${output_file}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Capture unhealthy app logs
        if: failure()
        env:
          PRODUCTION_BASE_DIR: ${{ vars.PRODUCTION_BASE_DIR }}
        run: |
          set -euo pipefail
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tg-lottery}"
          ssh production-server "BASE_DIR='${BASE_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          source "${BASE_DIR}/current/deploy/docker-env.sh"
          resolve_docker_command
          docker_cmd logs --timestamps --tail 250 tg-lottery-app 2>&1
          REMOTE
