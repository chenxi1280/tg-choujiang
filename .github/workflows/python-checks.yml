name: Python Checks

'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lottery_test
          POSTGRES_PASSWORD: lottery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lottery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:lottery_test@127.0.0.1:5432/lottery_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:lottery_test@127.0.0.1:5432/lottery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static quality gates
        run: |
          ruff format --check src tests alembic scripts
          ruff check src tests alembic scripts
          python scripts/check_code_metrics.py
          python -m compileall -q src tests alembic scripts
      - name: Verify migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Test
        run: pytest
        timeout-minutes: 1
      - name: Compose config
        run: docker compose --env-file .env.docker.example config >/dev/null
