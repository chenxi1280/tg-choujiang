name: Python Checks

'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static quality gates
        run: |
          ruff format --check src tests alembic scripts deploy
          ruff check src tests alembic scripts deploy
          python scripts/check_code_metrics.py
          python -m compileall -q src tests alembic scripts
      - name: Compose config
        run: docker compose --env-file .env.docker.example config >/dev/null

  tests:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Configure Shanghai test SSH
        env:
          SHANGHAI_TEST_HOST: ${{ vars.SHANGHAI_TEST_HOST }}
          SHANGHAI_TEST_SSH_PRIVATE_KEY: ${{ secrets.SHANGHAI_TEST_SSH_PRIVATE_KEY }}
          SHANGHAI_TEST_KNOWN_HOSTS: ${{ secrets.SHANGHAI_TEST_KNOWN_HOSTS }}
        run: bash deploy/configure-shanghai-test-ssh.sh
      - name: Run migrations and eight test shards in Shanghai Docker
        run: bash deploy/run-shanghai-tests.sh all
        timeout-minutes: 25

  build-image:
    runs-on: ubuntu-latest
    needs: [checks, tests]
    if: always() && needs.checks.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: false
          tags: tg-lottery-app:${{ github.sha }}
          cache-from: type=gha,scope=tg-lottery-app-checks
          cache-to: type=gha,mode=max,scope=tg-lottery-app-checks
