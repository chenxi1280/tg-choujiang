[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-lottery"
version = "0.1.0"
description = "Auditable Telegram group lottery bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=44,<47",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
tg-lottery-app = "tg_lottery.app:main"
tg-lottery-worker = "tg_lottery.worker:main"
tg-lottery-ops-bot = "tg_lottery.ops_bot:main"
tg-lottery-healthcheck = "tg_lottery.healthcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/tg_lottery/telegram/*.py" = ["RUF001"]
"src/tg_lottery/presentation/*.py" = ["RUF001"]
